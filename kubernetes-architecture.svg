<svg width="100%" viewBox="0 0 680 920" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Kubernetes cluster architecture diagram</title>
  <desc>A structural diagram showing a Kubernetes cluster with control plane components (API Server, etcd, Scheduler, Controller Manager), worker nodes with Pods, and external access via kubectl, Users, and Ingress.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .th { font-size: 14px; font-weight: 500; fill: #0C447C; }
      .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }

      /* Blue - control plane */
      .c-blue rect  { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue .th   { fill: #0C447C; }
      .c-blue .ts   { fill: #185FA5; }

      /* Purple - core components */
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th  { fill: #3C3489; }
      .c-purple .ts  { fill: #534AB7; }

      /* Teal - networking agents */
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th  { fill: #085041; }
      .c-teal .ts  { fill: #0F6E56; }

      /* Green - pods/workloads */
      .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
      .c-green .th  { fill: #27500A; }
      .c-green .ts  { fill: #3B6D11; }

      /* Amber - services/storage */
      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber .th  { fill: #633806; }
      .c-amber .ts  { fill: #854F0B; }

      /* Coral - config */
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral .th  { fill: #712B13; }
      .c-coral .ts  { fill: #993C1D; }

      /* Pink - security */
      .c-pink rect { fill: #FBEAF0; stroke: #993556; }
      .c-pink .th  { fill: #72243E; }
      .c-pink .ts  { fill: #993556; }

      /* Gray - external */
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th  { fill: #444441; }
      .c-gray .ts  { fill: #5F5E5A; }
    </style>
  </defs>

  <!-- External access label -->
  <text class="ts" x="340" y="22" text-anchor="middle">External access</text>

  <!-- kubectl -->
  <g class="c-gray">
    <rect x="40" y="30" width="110" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="95" y="52" text-anchor="middle" dominant-baseline="central">kubectl</text>
  </g>

  <!-- Users / CI -->
  <g class="c-gray">
    <rect x="285" y="30" width="110" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Users / CI</text>
  </g>

  <!-- Ingress -->
  <g class="c-teal">
    <rect x="530" y="30" width="110" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="585" y="52" text-anchor="middle" dominant-baseline="central">Ingress</text>
  </g>

  <!-- kubectl → API Server -->
  <line x1="95" y1="74" x2="95" y2="155" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="95" y1="155" x2="198" y2="185" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Users → API Server -->
  <line x1="340" y1="74" x2="290" y2="185" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Cluster boundary -->
  <rect x="20" y="110" width="640" height="770" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text class="ts" x="40" y="130">Kubernetes cluster</text>

  <!-- Control plane boundary -->
  <rect x="36" y="140" width="608" height="220" rx="12" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.6"/>
  <text class="ts" x="56" y="158" fill="#185FA5">Control plane</text>

  <!-- API Server -->
  <g class="c-blue">
    <rect x="236" y="165" width="208" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="186" text-anchor="middle" dominant-baseline="central">API Server</text>
    <text class="ts" x="340" y="206" text-anchor="middle" dominant-baseline="central">kube-apiserver</text>
  </g>

  <!-- etcd -->
  <g class="c-purple">
    <rect x="48" y="248" width="136" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="116" y="269" text-anchor="middle" dominant-baseline="central">etcd</text>
    <text class="ts" x="116" y="289" text-anchor="middle" dominant-baseline="central">Cluster state store</text>
  </g>

  <!-- Scheduler -->
  <g class="c-purple">
    <rect x="228" y="248" width="136" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="296" y="269" text-anchor="middle" dominant-baseline="central">Scheduler</text>
    <text class="ts" x="296" y="289" text-anchor="middle" dominant-baseline="central">kube-scheduler</text>
  </g>

  <!-- Controller Manager -->
  <g class="c-purple">
    <rect x="408" y="248" width="172" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="494" y="269" text-anchor="middle" dominant-baseline="central">Controller Manager</text>
    <text class="ts" x="494" y="289" text-anchor="middle" dominant-baseline="central">kube-controller-manager</text>
  </g>

  <!-- API Server connectors to control plane components -->
  <line x1="236" y1="208" x2="184" y2="248" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="296" y1="221" x2="296" y2="248" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="394" y1="208" x2="476" y2="248" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Worker Node 1 boundary -->
  <rect x="36" y="390" width="280" height="340" rx="12" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.7"/>
  <text class="ts" x="56" y="408" fill="#0F6E56">Worker node 1</text>

  <!-- Kubelet Node 1 -->
  <g class="c-teal">
    <rect x="50" y="415" width="122" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="111" y="437" text-anchor="middle" dominant-baseline="central">Kubelet</text>
  </g>

  <!-- Kube-proxy Node 1 -->
  <g class="c-teal">
    <rect x="182" y="415" width="122" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="243" y="437" text-anchor="middle" dominant-baseline="central">Kube-proxy</text>
  </g>

  <!-- Pod A -->
  <g class="c-green">
    <rect x="50" y="480" width="118" height="80" rx="8" stroke-width="0.5"/>
    <text class="th" x="109" y="504" text-anchor="middle" dominant-baseline="central">Pod A</text>
    <text class="ts" x="109" y="522" text-anchor="middle" dominant-baseline="central">App container</text>
    <text class="ts" x="109" y="540" text-anchor="middle" dominant-baseline="central">Sidecar</text>
  </g>

  <!-- Pod B -->
  <g class="c-green">
    <rect x="182" y="480" width="118" height="80" rx="8" stroke-width="0.5"/>
    <text class="th" x="241" y="504" text-anchor="middle" dominant-baseline="central">Pod B</text>
    <text class="ts" x="241" y="522" text-anchor="middle" dominant-baseline="central">App container</text>
    <text class="ts" x="241" y="540" text-anchor="middle" dominant-baseline="central">Init container</text>
  </g>

  <!-- Service Node 1 -->
  <g class="c-amber">
    <rect x="50" y="584" width="250" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="175" y="606" text-anchor="middle" dominant-baseline="central">Service (ClusterIP)</text>
  </g>

  <!-- ConfigMap -->
  <g class="c-coral">
    <rect x="50" y="648" width="118" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="109" y="670" text-anchor="middle" dominant-baseline="central">ConfigMap</text>
  </g>

  <!-- Secret -->
  <g class="c-coral">
    <rect x="182" y="648" width="118" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="241" y="670" text-anchor="middle" dominant-baseline="central">Secret</text>
  </g>

  <!-- Pod → Service arrows -->
  <line x1="109" y1="560" x2="109" y2="584" stroke="#639922" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="241" y1="560" x2="241" y2="584" stroke="#639922" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Worker Node 2 boundary -->
  <rect x="364" y="390" width="280" height="340" rx="12" fill="none" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.7"/>
  <text class="ts" x="384" y="408" fill="#0F6E56">Worker node 2</text>

  <!-- Kubelet Node 2 -->
  <g class="c-teal">
    <rect x="378" y="415" width="122" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="439" y="437" text-anchor="middle" dominant-baseline="central">Kubelet</text>
  </g>

  <!-- Kube-proxy Node 2 -->
  <g class="c-teal">
    <rect x="510" y="415" width="122" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="571" y="437" text-anchor="middle" dominant-baseline="central">Kube-proxy</text>
  </g>

  <!-- Pod C -->
  <g class="c-green">
    <rect x="378" y="480" width="118" height="80" rx="8" stroke-width="0.5"/>
    <text class="th" x="437" y="504" text-anchor="middle" dominant-baseline="central">Pod C</text>
    <text class="ts" x="437" y="522" text-anchor="middle" dominant-baseline="central">StatefulSet</text>
    <text class="ts" x="437" y="540" text-anchor="middle" dominant-baseline="central">App container</text>
  </g>

  <!-- Pod D -->
  <g class="c-green">
    <rect x="510" y="480" width="118" height="80" rx="8" stroke-width="0.5"/>
    <text class="th" x="569" y="504" text-anchor="middle" dominant-baseline="central">Pod D</text>
    <text class="ts" x="569" y="522" text-anchor="middle" dominant-baseline="central">DaemonSet</text>
    <text class="ts" x="569" y="540" text-anchor="middle" dominant-baseline="central">Log collector</text>
  </g>

  <!-- PVC -->
  <g class="c-amber">
    <rect x="378" y="584" width="250" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="503" y="606" text-anchor="middle" dominant-baseline="central">PVC → PersistentVolume</text>
  </g>

  <!-- HPA -->
  <g class="c-coral">
    <rect x="378" y="648" width="118" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="437" y="670" text-anchor="middle" dominant-baseline="central">HPA</text>
  </g>

  <!-- NetworkPolicy -->
  <g class="c-coral">
    <rect x="510" y="648" width="118" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="569" y="670" text-anchor="middle" dominant-baseline="central">NetworkPolicy</text>
  </g>

  <!-- Pod C → PVC -->
  <line x1="437" y1="560" x2="437" y2="584" stroke="#639922" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- API Server → Kubelet Node 1 (dashed) -->
  <line x1="280" y1="193" x2="111" y2="415" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- API Server → Kubelet Node 2 (dashed) -->
  <line x1="400" y1="193" x2="439" y2="415" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Ingress → Service routing -->
  <line x1="585" y1="74" x2="585" y2="375" stroke="#1D9E75" stroke-width="1"/>
  <line x1="585" y1="375" x2="300" y2="375" stroke="#1D9E75" stroke-width="1"/>
  <line x1="300" y1="375" x2="175" y2="584" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="455" y="368">routes traffic</text>

  <!-- Namespace band -->
  <rect x="36" y="755" width="608" height="60" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.5"/>
  <text class="ts" x="56" y="772" fill="#5F5E5A">Namespace</text>
  <text class="ts" x="340" y="789" text-anchor="middle" fill="#888780">Logical isolation boundary — RBAC, ResourceQuota, LimitRange applied per namespace</text>

  <!-- RBAC -->
  <g class="c-pink">
    <rect x="48" y="828" width="180" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="138" y="845" text-anchor="middle" dominant-baseline="central">RBAC</text>
    <text class="ts" x="138" y="862" text-anchor="middle" dominant-baseline="central">Role / ClusterRole / Binding</text>
  </g>

  <!-- ServiceAccount -->
  <g class="c-pink">
    <rect x="250" y="828" width="180" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="845" text-anchor="middle" dominant-baseline="central">ServiceAccount</text>
    <text class="ts" x="340" y="862" text-anchor="middle" dominant-baseline="central">Pod identity for API access</text>
  </g>

  <!-- Admission Controller -->
  <g class="c-pink">
    <rect x="452" y="828" width="180" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="542" y="845" text-anchor="middle" dominant-baseline="central">Admission Controller</text>
    <text class="ts" x="542" y="862" text-anchor="middle" dominant-baseline="central">Validate / mutate API requests</text>
  </g>

  <!-- Legend -->
  <text class="ts" x="40" y="898" fill="#888780">Color key:</text>
  <rect x="110" y="887" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="124" y="897" fill="#888780">Control plane</text>
  <rect x="220" y="887" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="234" y="897" fill="#888780">Core components</text>
  <rect x="350" y="887" width="10" height="10" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="ts" x="364" y="897" fill="#888780">Pods / workloads</text>
  <rect x="480" y="887" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="494" y="897" fill="#888780">Networking</text>
  <rect x="575" y="887" width="10" height="10" rx="2" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text class="ts" x="589" y="897" fill="#888780">Security</text>
</svg>
